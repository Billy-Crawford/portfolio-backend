name: Keep-alive Render Backend

on:
  schedule:
    # Exécuter toutes les 14 minutes
    - cron: '*/14 * * * *'
  workflow_dispatch: # Permet de lancer le script manuellement depuis GitHub

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend API
        run: |
          echo "Pinging the backend to prevent sleep..."
          curl -s https://portfolio-backend-0xfo.onrender.com/api/health
          echo -e "\n\nPing successful!"
